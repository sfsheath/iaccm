[project]
name = "iaccm"
version = "0.0.1"
description = "Identification of Archaeological Ceramics in the Central Mediterranean — an LLM-in-the-loop tool for identifying ceramic sherds against user-provided published typologies."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Sebastian Heath" }]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "anthropic>=0.69",     # official Claude SDK — default cloud provider
    "openai>=1.40",        # client for any OpenAI-compatible endpoint (Ollama, vLLM, remote)
    "pillow>=10.3",
    "pymupdf>=1.24",       # PDF render + text extraction
    "lancedb>=0.13",       # embedded, file-based vector store (no server)
    "langgraph>=0.2",      # agent graph with human-in-the-loop interrupts
    "langchain-core>=0.3",
    "gradio>=5",           # local browser UI (messages-format Chatbot)
    "typer>=0.12",         # CLI entry points
]

[project.optional-dependencies]
ocr = ["paddleocr>=2.7"]
embed = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.2", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
iaccm = "iaccm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iaccm"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Typer requires Option()/Argument() calls in parameter defaults

[tool.ruff.lint.per-file-ignores]
"src/iaccm/catalog/archetypes.py" = ["E501"]  # dense controlled-vocabulary table, kept one-per-line

[tool.pytest.ini_options]
testpaths = ["tests", "eval"]
# Live, paid tests (marker `ingest`) are DESELECTED by default so a plain `pytest` never spends on
# the API — even when a key is present in the environment. Run them explicitly with `-m ingest`.
addopts = "-ra -m 'not ingest'"
markers = [
    "ingest: live ingest-quality checks; opt-in (needs the source PDF + a model call). Run with -m ingest.",
]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
