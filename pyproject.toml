[project]
name = "iaccm"
version = "0.0.1"
description = "Identification of Archaeological Ceramics in the Central Mediterranean — an LLM-in-the-loop tool for identifying ceramic sherds against user-provided published typologies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sebastian Heath" }]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "openai>=1.40",        # client for any OpenAI-compatible endpoint (Ollama, vLLM, remote)
    "pillow>=10.3",
    "pymupdf>=1.24",       # PDF render + text extraction
    "lancedb>=0.13",       # embedded, file-based vector store (no server)
    "langgraph>=0.2",      # agent graph with human-in-the-loop interrupts
    "langchain-core>=0.3",
    "gradio>=4.44",        # local browser UI
    "typer>=0.12",         # CLI entry points
]

[project.optional-dependencies]
ocr = ["paddleocr>=2.7"]
embed = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.2", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
iaccm = "iaccm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iaccm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests", "eval"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
